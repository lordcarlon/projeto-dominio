<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projeto Domínio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0b09">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b09;--card:#1a1612;--card2:#241d16;--gold:#d4a63c;--gold2:#f6d77a;--ember:#e8542a;--ink:#f3e9d2;--mut:#9b8f7a;--ok:#5ec27a;--sh:inset 0 1px 0 #ffffff12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Barlow,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.bg{position:fixed;inset:0;background:radial-gradient(900px 500px at 80% -10%,#e8542a33,transparent 60%),radial-gradient(700px 500px at -10% 30%,#d4a63c22,transparent 60%);animation:br 8s ease-in-out infinite alternate;z-index:0}
@keyframes br{to{opacity:.55;transform:scale(1.08)}}
main{position:relative;z-index:1;padding:14px 14px 0;max-width:560px;margin:auto}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
.title{font-size:26px;font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--ember),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.sub{color:var(--mut);font-size:13px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #d4a63c33;border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh),0 8px 24px #0008}
.anim .card{animation:up .5s both}.anim .card:nth-child(2){animation-delay:.06s}.anim .card:nth-child(3){animation-delay:.12s}.anim .card:nth-child(4){animation-delay:.18s}.anim .card:nth-child(5){animation-delay:.24s}.anim .card:nth-child(6){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.days{display:flex;gap:6px;margin:12px 0}
.d{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid #ffffff10;color:var(--mut);font-size:12px;position:relative;overflow:hidden}
.d b{display:block;font-size:16px;color:var(--ink)}
.d.on{background:linear-gradient(180deg,var(--gold),#a47a1e);color:#1a1100;border-color:var(--gold2);box-shadow:0 0 18px #d4a63c66}.d.on b{color:#1a1100}
.d i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);display:block;transition:width .6s}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:#ffffff12}.ring .p{stroke:url(#g);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px #e8542a)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 24px Cinzel}
.ring small{font:500 11px Barlow;color:var(--mut)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:#d4a63c22;border:1px solid #d4a63c66;font-size:12px;color:var(--gold2);margin:2px 4px 2px 0}
.hot{animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 14px #e8542a}}
.it{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#ffffff08;border:1px solid #ffffff0d;color:var(--ink);border-radius:12px;padding:11px 12px;margin-top:8px;font:inherit;position:relative;overflow:hidden;transition:background .25s,transform .12s}
.it:active{transform:scale(.97)}
.it .s{font-size:22px;width:30px;text-align:center;transition:transform .35s cubic-bezier(.3,2,.5,1)}
.it.ok{background:linear-gradient(90deg,#5ec27a22,#ffffff08);border-color:#5ec27a66}.it.ok .s{transform:scale(1.2) rotate(-8deg)}
.it.par{background:#d4a63c1c;border-color:#d4a63c66}.it.no{background:#e8542a1c;border-color:#e8542a66}.it.na{opacity:.45}
.it small{display:block;color:var(--mut);font-size:12px}.it .w{margin-left:auto;font-size:11px;color:var(--gold)}
.rp{position:absolute;border-radius:50%;background:#f6d77a55;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.bar{height:8px;border-radius:9px;background:#ffffff12;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold2));border-radius:9px;transition:width .8s}
.leg{font-size:12px;color:var(--mut);text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#120f0cee;backdrop-filter:blur(14px);border-top:1px solid #d4a63c44;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:500 11px Barlow;padding:9px 0 8px;transition:.25s}
nav button span{display:block;font-size:21px;transition:transform .3s cubic-bezier(.3,2,.5,1)}
nav button.on{color:var(--gold2)}nav button.on span{transform:translateY(-3px) scale(1.2);filter:drop-shadow(0 0 8px var(--gold))}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 3px;text-align:center;border-bottom:1px solid #ffffff0d}td:first-child,th:first-child{text-align:left;min-width:120px;position:sticky;left:0;background:var(--card)}
th{color:var(--gold);font-weight:600}
.wk{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mut);cursor:pointer}.wk i{display:block;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--gold2),var(--ember));min-height:4px;transition:height .9s cubic-bezier(.2,.8,.2,1);margin-bottom:3px}
textarea,input{width:100%;background:#0d0b09;color:var(--ink);border:1px solid #d4a63c44;border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--gold)}label{font-size:13px;color:var(--gold2)}
.lv{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff0d;color:var(--mut)}.lv.on{color:var(--ink)}.lv.cur{color:var(--gold2);font-weight:600}.lv span{font-size:24px}
.ms{display:flex;gap:12px;align-items:center;cursor:pointer}.ms.cur{border-color:var(--ember);box-shadow:0 0 20px #e8542a44}.ms .b{font:800 22px Cinzel;color:var(--gold);width:34px}.ms.done{opacity:.6}
.art b{font-family:Cinzel;color:var(--gold)}.art q{display:block;margin-top:6px;font-style:italic;quotes:none;font-size:16px}
#up{position:fixed;inset:0;z-index:60;display:none;place-content:center;text-align:center;background:#000c;backdrop-filter:blur(6px)}#up.on{display:grid;animation:up .5s}
#up div{font:800 80px Cinzel;filter:drop-shadow(0 0 30px var(--gold))}#up h2{color:var(--gold2);font-size:26px}
button.go{background:linear-gradient(180deg,var(--gold),#a47a1e);border:0;border-radius:12px;padding:11px 20px;font:700 14px Barlow;color:#1a1100;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bg"></div><canvas id="fx"></canvas>
<div id="up"><div id="upi"></div><h2 id="upt"></h2><p class="sub">Novo nível desbloqueado</p><button class="go" onclick="this.parentNode.classList.remove('on')">Continuar</button></div>
<main id="m"></main>
<nav id="nv"></nav>
<script>
const A=[
{id:'abs',n:'Abstinência',i:'🛡️',c:'Quadro de Abstinência',it:[['Evitar pornografia','',1],['Evitar masturbação','',1],['Evitar excesso de redes sociais','',1],['Evitar conteúdo que me prejudica','',1],['Evitar procrastinação','',1],['Evitar discussões desnecessárias','',1],['Evitar gastar dinheiro impulsivamente','',1]]},
{id:'esp',n:'Espiritualidade',i:'📖',c:'Quadro Espiritual',it:[['Ler a Bíblia','1 capítulo',1],['Orar','10 min',1],['Anotar reflexão','1 anotação'],['Memorizar versículo','1'],['Silêncio / reflexão','10 min']]},
{id:'con',n:'Conhecimento',i:'🧠',c:'Quadro de Estudos',it:[['Estudar','1h'],['Ler','20 min'],['Tecnologia / Informática','30 min'],['Inglês','20 min'],['Praticar escrita','15 min']]},
{id:'cor',n:'Corpo',i:'💪',c:'Quadro Físico',it:[['Caminhada','20–30 min'],['Exercício','20 min'],['Beber água','meta pessoal'],['Dormir no horário',''],['Higiene pessoal','']]},
{id:'car',n:'Caráter',i:'👑',c:'Quadro de Caráter',it:[['Cumpri o que prometi a mim mesmo'],['Controlei meus impulsos'],['Não procurei desculpas'],['Mantive minha palavra'],['Tratei as pessoas com respeito'],['Evitei uma discussão desnecessária'],['Fiz uma coisa difícil que estava evitando']]}];
A.forEach(a=>a.it=a.it.map((x,j)=>({id:a.id+j,n:x[0],g:x[1]||'',w:x[2]?2:1})));
const ALL=A.flatMap(a=>a.it);
const LV=[[0,'🌑','Iniciante'],[50,'🌒','Em construção'],[100,'🌓','Disciplinado'],[200,'🌔','Consistente'],[300,'🌕','Dominante'],[500,'👑','Mestre da Disciplina']];
const IC={'':'☐',ok:'✅',par:'⏳',no:'❌',na:'—'},CY=['','ok','par','no','na'];
const MS=['Organizar minha rotina','Reduzir distrações','Aumentar o tempo de estudo','Fortalecer minha disciplina espiritual','Melhorar minha condição física','Controlar impulsos','Melhorar minha comunicação','Consolidar os hábitos'];
const AR=[['Disciplina','Eu não dependo da vontade para fazer aquilo que decidi fazer.'],['Abstinência','Aquilo que escolhi abandonar não será negociado diariamente com meus impulsos.'],['Consistência','Um dia ruim não cancela uma semana inteira de esforço.'],['Responsabilidade','Eu sou responsável pelas minhas escolhas, pelas minhas ações e pelo meu tempo.'],['Conhecimento','Todos os dias devo aprender alguma coisa que contribua para a pessoa que quero me tornar.'],['Espírito','Minha vida espiritual não será tratada como uma atividade secundária.'],['Corpo','Meu corpo deve receber cuidado, descanso e movimento.'],['Recomeço','Se eu falhar, não transformarei a falha em abandono. Analiso, corrijo e continuo.'],['Honestidade','O quadro deve representar a realidade. Não marco ✅ para fingir que cumpri.'],['Evolução','Meu objetivo não é ser perfeito. É ser melhor e mais disciplinado do que fui anteriormente.']];
const HM=['Quem quero me tornar?','Que hábitos preciso abandonar?','Que hábitos preciso construir?','O que quero aprender?','Como quero estar daqui a 90 dias?','Por que não posso desistir?'];
const RV=[['v1','Maior vitória'],['v2','Maior dificuldade'],['v3','O que me fez perder disciplina?'],['v4','O que vou mudar na próxima semana?'],['v5','Meu compromisso para a próxima semana']];
const pad=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let S={};try{S=JSON.parse(localStorage.getItem('dom'))||{}}catch(e){}
S.days=S.days||{};S.n=S.n||{};S.rev=S.rev||{};S.m=S.m||{};S.h=S.h||{};S.start=S.start||dk(new Date());
const save=()=>{try{localStorage.setItem('dom',JSON.stringify(S))}catch(e){}};
const today=new Date(),TK=dk(today);let sel=TK,view='hoje',prev=0;
const mon=k=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d};
const wdays=k=>{const m=mon(k);return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})};
function sc(k){let p=0,mx=0;const D=S.days[k]||{};ALL.forEach(i=>{const s=D[i.id]||'';if(s==='na')return;mx+=i.w;p+=s==='ok'?i.w:s==='par'?i.w/2:0});return{p,mx}}
const pct=k=>{const r=sc(k);return r.mx?r.p/r.mx:0};
const total=()=>Object.keys(S.days).reduce((a,k)=>a+sc(k).p,0);
const lvl=t=>{let l=0;LV.forEach((x,i)=>{if(t>=x[0])l=i});return l};
function streak(){let n=0,d=new Date();if(pct(dk(d))<.6)d.setDate(d.getDate()-1);while(pct(dk(d))>=.6){n++;d.setDate(d.getDate()-1)}return n}
const R=n=>Math.round(n*10)/10;
function ring(v){const c=326.7;return`<div class="ring"><svg width="118" height="118" viewBox="0 0 118 118"><defs><linearGradient id="g"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#e8542a"/></linearGradient></defs><circle class="t" cx="59" cy="59" r="52"/><circle class="p" id="rp" cx="59" cy="59" r="52" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-prev)}" data-to="${c*(1-v)}"/></svg><div>${Math.round(v*100)}%<small>do dia</small></div></div>`}
function H(){const r=sc(sel),t=total(),L=lvl(t),st=streak(),D=S.days[sel]||{};const wd=wdays(sel),nm=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
let h=`<h1 class="title">⚔️ PROJETO DOMÍNIO</h1><div class="sub">Quadro de disciplina pessoal</div>
<div class="days">${wd.map((d,i)=>{const k=dk(d);return`<div class="d ${k===sel?'on':''}" data-d="${k}">${nm[i]}<b>${d.getDate()}</b><i style="width:${pct(k)*100}%"></i></div>`}).join('')}</div>
<div class="card row">${ring(pct(sel))}<div><div class="sub">${sel===TK?'Hoje':sel}</div><h3>${R(r.p)} / ${r.mx} pts</h3><span class="chip">${LV[L][1]} ${LV[L][2]}</span><span class="chip ${st?'hot':''}">🔥 ${st} dia${st==1?'':'s'}</span><span class="chip">⭐ ${R(t)} total</span></div></div>
<div class="leg">Toque para alternar: ☐ → ✅ cumprido → ⏳ parcial → ❌ não cumprido → — não se aplicava</div>`;
A.forEach(a=>{const done=a.it.filter(i=>D[i.id]==='ok').length;h+=`<div class="card"><div class="row sp"><h3>${a.i} ${a.c}</h3><span class="sub">${done}/${a.it.length}</span></div><div class="bar"><i style="width:${done/a.it.length*100}%"></i></div>${a.it.map(i=>{const s=D[i.id]||'';return`<button class="it ${s}" data-i="${i.id}"><span class="s">${IC[s]}</span><span>${i.n}${i.g?`<small>${i.g}</small>`:''}</span><span class="w">${i.w==2?'+2':'+1'}</span></button>`}).join('')}</div>`});
return h}
function W(){const wd=wdays(sel),wk=dk(mon(sel)),nm=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let ok=0,tp=0,tm=0;
wd.forEach(d=>{const k=dk(d),r=sc(k);tp+=r.p;tm+=r.mx;if(pct(k)>=.7)ok++});
const N=S.n[wk]||{},Rv=S.rev[wk]||{};
let h=`<h1 class="title">📅 SEMANA</h1><div class="sub">Semana de ${wd[0].getDate()}/${wd[0].getMonth()+1}</div>
<div class="card"><h3>Minha semana</h3><p>Dias cumpridos (≥70%): <b>${ok} / 7</b><br>Pontuação: <b>${R(tp)} / ${tm||0}</b></p><div class="wk">${wd.map((d,i)=>`<div data-d="${dk(d)}"><i style="height:${pct(dk(d))*90}px"></i>${nm[i]}</div>`).join('')}</div></div>`;
A.forEach(a=>{h+=`<div class="card"><h3>${a.i} ${a.c}</h3><div class="sc"><table><tr><th></th>${nm.map(n=>`<th>${n}</th>`).join('')}</tr>${a.it.map(i=>`<tr><td>${i.n}</td>${wd.map(d=>`<td>${IC[(S.days[dk(d)]||{})[i.id]||'']}</td>`).join('')}</tr>`).join('')}</table></div></div>`});
h+=`<div class="card"><h3>📖 Versículo da semana</h3>${[['vs','Versículo da semana'],['ap','O que aprendi'],['pa','O que preciso aplicar']].map(x=>`<label>${x[1]}</label><textarea rows="2" data-o="n" data-w="${wk}" data-k="${x[0]}">${esc(N[x[0]])}</textarea>`).join('')}</div>
<div class="card"><h3>📝 Revisão semanal</h3>${RV.map(x=>`<label>${x[1]}</label><textarea rows="2" data-o="rev" data-w="${wk}" data-k="${x[0]}">${esc(Rv[x[0]])}</textarea>`).join('')}</div>`;return h}
function N(){const t=total(),L=lvl(t),nx=LV[L+1],p=nx?(t-LV[L][0])/(nx[0]-LV[L][0]):1;
return`<h1 class="title">🔥 EVOLUÇÃO</h1><div class="card" style="text-align:center"><div style="font-size:70px;filter:drop-shadow(0 0 20px #d4a63c)">${LV[L][1]}</div><h2>${LV[L][2]}</h2><p class="sub">${R(t)} pontos acumulados · sequência de ${streak()} dia(s)</p><div class="bar"><i style="width:${p*100}%"></i></div><p class="sub">${nx?`Faltam ${R(nx[0]-t)} pts para ${nx[2]}`:'Nível máximo alcançado'}</p></div>
<div class="card"><h3>Níveis</h3>${LV.map((x,i)=>`<div class="lv ${i<=L?'on':''} ${i==L?'cur':''}"><span>${x[1]}</span>${x[2]}<small style="margin-left:auto">${x[0]}${i<5?'–'+(LV[i+1][0]-1):'+'}</small></div>`).join('')}</div>
<div class="card"><h3>Sequência de 30 dias</h3><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px">${[...Array(30)].map((_,i)=>{const d=new Date(S.start+'T12:00');d.setDate(d.getDate()+i);const k=dk(d),v=pct(k);return`<div title="Dia ${i+1}" style="aspect-ratio:1;border-radius:7px;background:${v>=.6?'linear-gradient(135deg,#f6d77a,#e8542a)':v>0?'#d4a63c44':'#ffffff10'};font-size:10px;display:grid;place-content:center;color:${v>=.6?'#1a1100':'#9b8f7a'}">${i+1}</div>`}).join('')}</div><p class="sub">Dia 1 → Dia 30. Não é nunca falhar: é não deixar uma falha virar desistência.</p></div>
<div class="card"><h3>Pontuação</h3><p class="sub">✅ cumprido +1 · item importante +2 · ⏳ parcial vale metade · ❌ 0 ponto, sem pontos negativos · — sai da conta do dia.</p></div>`}
function M(){const cur=Math.floor((new Date(TK)-new Date(S.start))/6048e5)%8;
return`<h1 class="title">🏆 MISSÕES</h1><div class="sub">Uma missão por semana, a cumprir em ciclo de 8 semanas</div>${MS.map((m,i)=>`<div class="card ms ${i==cur?'cur':''} ${S.m[i]?'done':''}" data-m="${i}"><div class="b">${i+1}</div><div><h3 style="font-size:16px">Semana ${i+1}</h3>${m}${i==cur?'<br><span class="chip">Missão atual</span>':''}</div><div style="margin-left:auto;font-size:26px">${S.m[i]?'🏅':'⚔️'}</div></div>`).join('')}`}
function C(){return`<h1 class="title">⚔️ CONSTITUIÇÃO</h1><div class="sub">Projeto Domínio</div>${AR.map((a,i)=>`<div class="card art"><b>Artigo ${['I','II','III','IV','V','VI','VII','VIII','IX','X'][i]} — ${a[0]}</b><q>${a[1]}</q></div>`).join('')}
<div class="card"><h3>👑 O homem que estou construindo</h3>${HM.map((q,i)=>`<label>${q}</label><textarea rows="2" data-o="h" data-k="${i}">${esc(S.h[i])}</textarea>`).join('')}<label>Data de início do projeto</label><input type="date" id="st" value="${S.start}"></div>`}
const V={hoje:['⚔️','Hoje',H],sem:['📅','Semana',W],niv:['🔥','Nível',N],mis:['🏆','Missões',M],con:['📜','Alma',C]};
function draw(an){document.getElementById('m').className=an?'anim':'';document.getElementById('m').innerHTML=V[view][2]();document.getElementById('nv').innerHTML=Object.keys(V).map(k=>`<button class="${k==view?'on':''}" data-v="${k}"><span>${V[k][0]}</span>${V[k][1]}</button>`).join('');const r=document.getElementById('rp');if(r)requestAnimationFrame(()=>requestAnimationFrame(()=>{r.setAttribute('stroke-dashoffset',r.dataset.to);prev=pct(sel)}))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-d],[data-i],[data-m]');if(!t)return;
if(t.dataset.v){view=t.dataset.v;scrollTo(0,0);draw(1);vib(10)}
else if(t.dataset.d){sel=t.dataset.d;if(view=='sem'){view='hoje'}scrollTo(0,0);prev=0;draw(1)}
else if(t.dataset.m){S.m[t.dataset.m]=!S.m[t.dataset.m];save();draw(0);if(S.m[t.dataset.m])burst(e.clientX,e.clientY,70);vib(30)}
else if(t.dataset.i){const id=t.dataset.i,D=S.days[sel]=S.days[sel]||{},b=lvl(total()),ps=window.scrollY;const n=CY[(CY.indexOf(D[id]||'')+1)%5];D[id]=n;if(!n)delete D[id];save();
