<!doctype html><html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b09"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Projeto Domínio</title>
<style>
:root{--bg:#0d0b09;--c:#1a1612;--c2:#241d16;--g:#d4a63c;--g2:#f6d77a;--e:#e8542a;--t:#f3e9d2;--m:#9b8f7a;--ok:#5ec27a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:500 15px/1.45 system-ui,sans-serif}body{padding-bottom:84px}main{max-width:620px;margin:auto;padding:16px}.title{font:800 27px Georgia;color:var(--g2)}.sub{color:var(--m);font-size:13px}.card{background:linear-gradient(160deg,var(--c2),var(--c));border:1px solid #d4a63c35;border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 8px 25px #0008}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px;border-radius:12px;background:#fff1;border:1px solid #fff2}.stat strong{display:block;color:var(--g2);font-size:22px}.progress{height:9px;background:#fff2;border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--e),var(--g2))}.btn{background:linear-gradient(180deg,var(--g),#a47a1e);color:#1a1100;border:0;border-radius:11px;padding:10px 14px;font-weight:800}.btn.alt{background:#fff1;color:var(--t);border:1px solid #d4a63c55}.item,.choice{width:100%;text-align:left;background:#fff1;color:var(--t);border:1px solid #fff2;border-radius:11px;padding:11px;margin-top:7px}.item.ok,.choice.correct{border-color:#5ec27a;background:#5ec27a22}.item.par{border-color:#d4a63c}.item.no,.choice.wrong{border-color:#e8542a;background:#e8542a22}.pill{display:inline-block;border:1px solid #d4a63c66;color:var(--g2);padding:3px 9px;border-radius:99px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#120f0fee;border-top:1px solid #d4a63c44;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:none;border:0;color:var(--m);padding:8px 2px;font-size:11px}.nav b{display:block;font-size:20px}.nav .on{color:var(--g2)}input,textarea,select{width:100%;background:#0d0b09;color:var(--t);border:1px solid #d4a63c44;border-radius:10px;padding:10px;margin:5px 0 10px}label{color:var(--g2);font-size:13px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap;background:#fff1;color:var(--m);border:1px solid #fff2;border-radius:99px;padding:8px}.tabs button:hover{color:#1a1100;background:var(--g)}canvas{width:100%;background:#fff1;border-radius:12px}
</style></head><body><main id="app"></main><div class="nav" id="nav"></div>
<script>
const K="dominio-v2";function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function T(){return fmt(new Date())}const base={days:{},journal:{},tests:[],wrong:[],body:[],workouts:[],goals:{},profile:{start:T()}};let S=load(),view="home",quiz=null;
function load(){try{return {...base,...JSON.parse(localStorage.getItem(K)||"{}")}}catch(e){return {...base}}}function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(x){return String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
const A=[["Abstinência",["Evitar pornografia","Evitar masturbação","Evitar excesso de redes sociais","Evitar conteúdo que me prejudica","Evitar procrastinação","Evitar discussões desnecessárias","Evitar gastar dinheiro impulsivamente"]],["Espiritualidade",["Ler a Bíblia — 1 capítulo","Orar — 10 min","Anotar reflexão","Memorizar versículo","Silêncio / reflexão — 10 min"]],["Conhecimento",["Estudar — 1h","Ler — 20 min","Tecnologia / Informática — 30 min","Inglês — 20 min","Praticar escrita — 15 min"]],["Corpo",["Caminhada — 20–30 min","Exercício — 20 min","Beber água — meta pessoal","Dormir no horário","Higiene pessoal"]],["Caráter",["Cumpri o que prometi a mim mesmo","Controlei meus impulsos","Não procurei desculpas","Mantive minha palavra","Tratei as pessoas com respeito","Evitei uma discussão desnecessária","Fiz uma coisa difícil que estava evitando"]]];
const Q=[["Bíblia","Qual é o primeiro livro da Bíblia?",["Gênesis","Êxodo","Salmos","Mateus"],0],["Informática","Qual é a função principal de um sistema operacional?",["Gerenciar recursos do computador","Criar eletricidade","Aumentar o Wi‑Fi","Imprimir sem hardware"],0],["Informática","Qual componente executa instruções de programas?",["CPU","Monitor","Teclado","Caixa de som"],0],["Português","Qual palavra está corretamente acentuada?",["cafe","café","cáfe","cafê"],1],["Inglês","O que significa “book”?",["Casa","Livro","Mesa","Água"],1],["Conhecimentos Gerais","Qual é o maior planeta do Sistema Solar?",["Terra","Marte","Júpiter","Vênus"],2],["Disciplina","Você perdeu um dia da rotina. Qual atitude é mais consistente?",["Desistir","Recomeçar no dia seguinte","Esconder o erro","Tornar tudo impossível"],1]];
const LV=[[0,"🌑","Iniciante"],[50,"🌒","Em construção"],[100,"🌓","Disciplinado"],[200,"🌔","Consistente"],[300,"🌕","Dominante"],[500,"👑","Mestre da Disciplina"]];
function day(d=T()){let x=S.days[d]||{},p=0,n=0;A.forEach(a=>a[1].forEach((_,i)=>{n++;let v=x[a[0]+i];p+=v=="ok"?1:v=="par"?.5:0}));return[p,n,n?p/n:0]}function total(){return Object.keys(S.days).reduce((s,d)=>s+day(d)[0],0)}function lev(){let l=0;LV.forEach((x,i)=>{if(total()>=x[0])l=i});return l}function streak(){let n=0,d=new Date();while(day(fmt(d))[2]>=.6){n++;d.setDate(d.getDate()-1)}return n}
function go(v){view=v;quiz=null;render();scrollTo(0,0)}function nav(){let n=[["home","🏠","Início"],["discipline","⚔️","Disciplina"],["tests","🧠","Testes"],["body","💪","Corpo"],["profile","👑","Perfil"]];document.getElementById("nav").innerHTML=n.map(x=>`<button class="${view==x[0]?"on":""}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("")}function head(a,b){return `<h1 class="title">⚔️ ${a}</h1><div class="sub">${b}</div>`}function card(x){return `<section class="card">${x}</section>`}
function render(){let h=view=="home"?home():view=="discipline"?discipline():view=="tests"?tests():view=="body"?body():profile();document.getElementById("app").innerHTML=h;nav();if(view=="body")chart()}
function home(){let d=day(),L=LV[lev()];return head("PROJETO DOMÍNIO","Disciplina, conhecimento, espiritualidade e evolução.")+card(`<div class="grid"><div class="stat"><strong>${Math.round(d[2]*100)}%</strong>Hoje</div><div class="stat"><strong>${Math.round(total())}</strong>Pontos</div><div class="stat"><strong>${streak()}</strong>Sequência</div><div class="stat"><strong>${L[1]}</strong>${L[2]}</div></div><div class="progress"><i style="width:${d[2]*100}%"></i></div>`)+card(`<h3>📌 Acesso rápido</h3><button class="btn" onclick="go('discipline')">Disciplina</button> <button class="btn alt" onclick="go('tests')">Teste</button> <button class="btn alt" onclick="go('body')">Corpo</button>`) }
function discipline(){let h=head("DISCIPLINA","Toque para alternar: ☐ → ✅ → ⏳ → ❌ → —");let D=S.days[T()]||{};A.forEach(a=>{h+=card(`<div class="row between"><h3>${a[0]}</h3></div>`+a[1].map((x,i)=>{let id=a[0]+i,v=D[id]||"";return `<button class="item ${v}" onclick="cycle('${id}')">${v=="ok"?"✅":v=="par"?"⏳":v=="no"?"❌":v=="na"?"—":"☐"} ${x}</button>`}).join(""))});h+=card(`<h3>📝 Diário de hoje</h3><textarea id="j" rows="5" placeholder="O que fiz bem? Onde falhei? O que farei diferente amanhã?">${esc(S.journal[T()]||"")}</textarea><button class="btn" onclick="journal()">Guardar</button>`);return h}
function cycle(id){let k=T(),D=S.days[k]||{},z=["","ok","par","no","na"],i=(z.indexOf(D[id]||"")+1)%z.length;i?D[id]=z[i]:delete D[id];S.days[k]=D;save();render()}function journal(){S.journal[T()]=document.getElementById("j").value;save();alert("Diário guardado.")}
function tests(){if(quiz)return qpage();return head("CENTRO DE TESTES","Teste memória e conhecimento; resultados ficam no dispositivo.")+card(`<div class="tabs">${["Todas","Bíblia","Informática","Inglês","Português","Conhecimentos Gerais","Disciplina"].map(c=>`<button onclick="start('${c}')">${c}</button>`).join("")}</div>`)+card(`<h3>📊 Histórico</h3>${S.tests.slice(-6).reverse().map(x=>`<p>${x.cat}: <b>${x.score}/${x.total}</b> (${x.pct}%) — ${x.date}</p>`).join("")||"<p class='sub'>Nenhum teste ainda.</p>"}`)+card(`<h3>🔄 Revisão</h3><p>${S.wrong.length} pergunta(s) para revisar.</p>${S.wrong.length?'<button class="btn" onclick="review()">Revisar erros</button>':""}`)}
function start(cat){let p=Q.filter(x=>cat=="Todas"||x[0]==cat).sort(()=>Math.random()-.5).slice(0,10);quiz={cat,qs:p,i:0,s:0};render()}function review(){let p=S.wrong.map(i=>Q[i]).filter(Boolean);quiz={cat:"Revisão",qs:p,i:0,s:0};render()}function qpage(){let q=quiz.qs[quiz.i];return head("TESTE",`${quiz.cat} · ${quiz.i+1}/${quiz.qs.length}`)+card(`<div style="font-size:18px">${q[1]}</div>${q[2].map((x,i)=>`<button class="choice" onclick="ans(${i})">${String.fromCharCode(65+i)}) ${x}</button>`).join("")}`)}function ans(i){let q=quiz.qs[quiz.i];if(i==q[3])quiz.s++;else{let n=Q.indexOf(q);if(n>=0&&!S.wrong.includes(n))S.wrong.push(n)}if(i==q[3]){let n=Q.indexOf(q);S.wrong=S.wrong.filter(x=>x!==n)}quiz.i++;if(quiz.i>=quiz.qs.length){let r={cat:quiz.cat,score:quiz.s,total:quiz.qs.length,pct:Math.round(quiz.s/quiz.qs.length*100),date:T()};S.tests.push(r);save();alert(`Resultado: ${r.score}/${r.total} — ${r.pct}%`);quiz=null}render()}
function body(){let x=S.body.at(-1)||{};return head("EVOLUÇÃO DO CORPO","Registe tendências ao longo do tempo.")+card(`<div class="grid"><div class="stat"><strong>${x.weight??"—"}</strong>kg</div><div class="stat"><strong>${S.workouts.length}</strong>treinos</div><div class="stat"><strong>${x.waist??"—"}</strong>cm cintura</div><div class="stat"><strong>${x.arm??"—"}</strong>cm braço</div></div>`)+card(`<h3>📏 Nova medição</h3><label>Data</label><input id="bd" type="date" value="${T()}"><label>Peso kg</label><input id="bw" type="number" step=".1"><label>Cintura cm</label><input id="bc" type="number" step=".1"><label>Peito cm</label><input id="bp" type="number" step=".1"><label>Braço cm</label><input id="ba" type="number" step=".1"><label>Coxa cm</label><input id="bt" type="number" step=".1"><button class="btn" onclick="measure()">Guardar medição</button>`)+card(`<h3>🏋️ Novo treino</h3><select id="wt"><option>Treino geral</option><option>Caminhada</option><option>Corrida</option><option>Flexões</option><option>Abdominais</option><option>Alongamento</option></select><label>Duração (min)</label><input id="wd" type="number"><label>Repetições</label><input id="wr" type="number"><button class="btn" onclick="workout()">Guardar treino</button>`)+card(`<h3>📈 Peso</h3><canvas id="cv" width="600" height="250"></canvas>`)+card(`<h3>🎯 Metas</h3><label>Meta de peso kg</label><input id="gw" type="number" step=".1" value="${S.goals.weight||""}"><label>Treinos por semana</label><input id="gt" type="number" value="${S.goals.workouts||""}"><button class="btn" onclick="goals()">Guardar metas</button>`)}
function measure(){S.body.push({date:document.getElementById("bd").value,weight:+document.getElementById("bw").value||null,waist:+document.getElementById("bc").value||null,chest:+document.getElementById("bp").value||null,arm:+document.getElementById("ba").value||null,thigh:+document.getElementById("bt").value||null});S.body.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function workout(){S.workouts.push({date:T(),type:document.getElementById("wt").value,duration:+document.getElementById("wd").value||0,reps:+document.getElementById("wr").value||0});save();render()}function goals(){S.goals={weight:+document.getElementById("gw").value||null,workouts:+document.getElementById("gt").value||null};save();alert("Metas guardadas.")}
function chart(){let c=document.getElementById("cv");if(!c)return;let a=S.body.filter(x=>x.weight),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);if(!a.length){x.fillStyle="#9b8f7a";x.font="18px system-ui";x.fillText("Adicione uma medição para ver o gráfico.",25,120);return}let mi=Math.min(...a.map(z=>z.weight)),ma=Math.max(...a.map(z=>z.weight));x.strokeStyle="#d4a63c";x.lineWidth=4;x.beginPath();a.forEach((z,i)=>{let xx=30+i*(W-60)/Math.max(1,a.length-1),yy=H-30-(z.weight-mi)/Math.max(1,ma-mi)*(H-60);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}
function profile(){let L=LV[lev()];return head("PERFIL","Conquistas, constituição e backup.")+card(`<h3>${L[1]} ${L[2]}</h3><p>${Math.round(total())} pontos · ${streak()} dias</p>`)+card(`<h3>🏆 Conquistas</h3><p>${Object.keys(S.days).length?"🏅 Primeiro Dia":"🔒 Primeiro Dia"}</p><p>${streak()>=7?"🔥 7 Dias":"🔒 7 Dias"}</p><p>${S.tests.length>=5?"🧠 Mente em Evolução":"🔒 Mente em Evolução"}</p><p>${S.workouts.length>=10?"💪 Corpo em Evolução":"🔒 Corpo em Evolução"}</p>`)+card(`<h3>📜 Constituição</h3><p class="sub">Disciplina · Abstinência · Consistência · Responsabilidade · Conhecimento · Espírito · Corpo · Recomeço · Honestidade · Evolução</p>`)+card(`<h3>💾 Backup</h3><button class="btn" onclick="exporter()">📤 Exportar</button> <button class="btn alt" onclick="document.getElementById('imp').click()">📥 Importar</button><input id="imp" type="file" accept=".json" hidden onchange="importer(this)">`)+card(`<button class="btn alt" onclick="resetAll()">Apagar todos os dados</button>`)}
function exporter(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="projeto-dominio-backup.json";a.click()}function importer(i){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.days)throw 0;if(confirm("Restaurar e substituir os dados atuais?")){S={...base,...x};save();render()}}catch(e){alert("Backup inválido.")}};r.readAsText(i.files[0])}function resetAll(){if(confirm("Apagar todos os dados locais?")){localStorage.removeItem(K);S=load();render()}}
render();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
